name: Unit tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  build_and_test:

    strategy:
      matrix:
        configuration: [Debug, Release]

    runs-on: windows-latest  # For a list of available runner types, refer to
                             # https://help.github.com/en/actions/reference/workflow-syntax-for-github-actions#jobsjob_idruns-on

    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        fetch-depth: 0

    # Install the .NET Core workload
    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Add  MSBuild to the PATH: https://github.com/microsoft/setup-msbuild
    - name: Setup MSBuild.exe
      uses: microsoft/setup-msbuild@v1.0.2

    - name: Restore the application
      run: dotnet restore
      env:
        Configuration: ${{ matrix.configuration }}
        
    - name: Build
      run: dotnet build --configuration ${{matrix.configuration}} --no-restore

    # Execute all unit tests in the solution
    - name: Execute unit tests
      run: dotnet test --configuration ${{matrix.configuration}} --no-restore --verbosity normal

  benchmark_smoke:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install .NET Core
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    # Validate that the benchmarks build and run; real measurements happen in the nightly workflow
    - name: Run benchmarks smoke test
      run: dotnet run --project LogGrokX.Benchmarks -c Release -- --filter "*" --job Dry

  installer_compile:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Inno Setup
      shell: pwsh
      run: choco install innosetup --version=6.7.1 -y --no-progress

    - name: Compile installer script
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path ./installer/publish-x64 | Out-Null
        Copy-Item ./LogGrokX/appsettings.yaml ./installer/publish-x64/
        Set-Content ./installer/publish-x64/LogGrokX.exe "stub"
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=0.0.0 /O"./artifacts" "./installer/LogGrokX.iss"
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
